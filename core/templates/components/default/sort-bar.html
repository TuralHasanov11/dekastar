{% load i18n %}
{% load query_transform %}
<div class="sort-bar clearfix">
  <div class="sort-results pull-left">
    {{form.paginate_by}}
  </div>

  <div class="sort-options pull-right">
    <span class="d-none d-sm-inline-block">{% translate "Sort by" %}</span>

    {{form.order_by}}

    <span class="grid-list">
      <a href="?{% query_transform view='grid' %}"><i class="fa fa-th-large"></i></a>
      <a href="?{% query_transform view='list' %}"><i class="fa fa-align-justify"></i></a>
      <span
        class="toggle-filters-mobile d-inline-block d-md-none"
      >
        <span
          class="spinner-grow spinner-grow-sm text-warning"
          role="status"
          aria-hidden="true"
        ></span>
        <i class="fa fa-sliders"></i>
      </span>
    </span>
  </div>
</div>
