{% load get_product_quantity_type_display %}
<div class="cart-block cart-block-item clearfix cart-checkout-item" data-product_id="{{product.id}}">
  <div class="image">
    <a href="{% url "apps.store:product-detail" slug=product.slug %}">
        <img src="{{product.get_image_feature}}" alt="{{product.name}}" />
    </a>
  </div>
  <div class="title">
    <div class="h4">
        <a href="{% url "apps.store:product-detail" slug=product.slug %}">
            {{product.name}}
        </a>
    </div>
  </div>
  <div class="quantity">
    <input type="number" min="1" value="{{quantity}}" class="form-control form-quantity" />
    <span>{{product.quantity_type|get_product_quantity_type_display|safe}}</span>
  </div>
  <div class="price">
    {% if product.discount %}
    <span class="final h3">&#8380; {{product.discount_price}}</span>
    <span class="discount">&#8380; {{product.regular_price}}</span>
    {% else %}
    <span class="final h3">&#8380; {{product.regular_price}}</span>
    {% endif %}
  </div>
  <span class="icon icon-cross icon-delete"></span>
</div>
