{% load get_product_quantity_type_display %}
<div class="cart-block cart-block-item clearfix cart-nav-item" data-product_id="{{product.id}}">
  <div class="image">
    <a href="{% url "apps.store:product-detail" slug=product.slug %}">
        <img data-src="{{product.get_image_feature}}" alt="{{product.name}}" class="lazyload" />
    </a>
  </div>
  <div class="title">
    <div><a href="{% url "apps.store:product-detail" slug=product.slug %}">{{product.name}}</a></div>
  </div>
  <div class="quantity">
    {{quantity}}
  </div>
  <div class="price">
    {% if product.discount %}
    <span class="final">&#8380; {{product.discount_price}}</span>
    <span class="discount">&#8380; {{product.regular_price}}</span>
    {% else %}
    <span class="final">&#8380; {{product.regular_price}}</span>
    {% endif %}
  </div>
</div>
