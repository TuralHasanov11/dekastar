<ol class="breadcrumb">
    {% for item in breadcrumb %}
    {% if forloop.counter == breadcrumb|length %}
    <li class="breadcrumb-item active" aria-current="page">{{ item.title }}</li>
    {% else %}
    <li class="breadcrumb-item"><a href="{{ item.route }}">{{ item.title }}</a></li>
    {% endif %}
    {% endfor %}
</ol>
