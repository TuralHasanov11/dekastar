<div class="col-6 col-lg-4">
  <article>
    <div class="info">
      <span class="add-favorite {% if category %}added{% endif %}">
        <a
          href="javascript:void(0);"
          data-title="Add to favorites"
          data-title-added="Added to favorites list"
        >
          <i class="icon icon-heart"></i>
        </a>
      </span>
    </div>
    <div class="btn btn-add">
      <i class="icon icon-cart"></i>
    </div>
    <div class="figure-grid">
      {% if product.discount %}<span class="badge badge-warning">-{{product.discount}}%</span>{% endif %}
      <div class="image">
        <a href="{% url 'apps.store:product-detail' slug=product.slug %}">
          <img src="{{product.get_image_feature}}" alt="{{product}}" />
        </a>
      </div>
      <div class="text">
        <h2 class="title h4">
          <a href="{% url 'apps.store:product-detail' slug=product.slug %}">{{product}}</a>
        </h2>
        <sub>$ {{product.regular_price}}</sub>
        {% if product.discount_price %}<sup>$ {{product.discount_price}}</sup>{% endif %}
      </div>
    </div>
  </article>
</div>
