{% load i18n %} 

<section class="blog blog-block">
  <header>
    <div class="container">
      <h2 class="title">{% translate "Featured categories" %}</h2>
      <div class="text">
        <p>
          <a href="{% url 'apps.store:category-products' %}" class="btn btn-main"
            >{% translate "View more" %}</a
          >
        </p>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="scroll-wrapper">
      <div class="row scroll text-center">
        {% for category in categories %}
        <div class="col-md-4">
          <article data-3d>
            <a href="{% url 'apps.store:category-products' category=category.slug %}">
              <div class="image">
                <img src="{{category.cover_image.url}}" alt="{{category}}" />
              </div>
              <div class="entry entry-block">
                <div class="label">{{category.products_count}} {% translate "products" %}</div>
                <div class="title">
                  <h2 class="h4">{{category}}</h2>
                </div>
              </div>
              <div class="show-more">
                <span class="btn btn-clean">{% translate "Shop now" %}</span>
              </div>
            </a>
          </article>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
